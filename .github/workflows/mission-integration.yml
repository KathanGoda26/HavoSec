name: Mission integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mission-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISSION_TEST_MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=havosec_test
      MISSION_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-missions.txt
      - name: Start MongoDB and Temporal
        run: |
          docker run -d --name mongo-test -p 127.0.0.1:27017:27017 \
            mongo:7 --replSet havosec_test --bind_ip_all
          docker run -d --name temporal-test -p 127.0.0.1:7233:7233 \
            temporalio/temporal:latest server start-dev --ip 0.0.0.0
          timeout 60s bash -c 'until docker exec mongo-test mongosh --quiet --eval "db.adminCommand({ping: 1})"; do sleep 2; done'
          docker exec mongo-test mongosh --quiet --eval \
            'rs.initiate({_id:"havosec_test",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          timeout 60s bash -c 'until docker exec mongo-test mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 2; done'
          timeout 60s bash -c 'until docker exec temporal-test temporal operator cluster health; do sleep 2; done'
      - name: Run the live mission tests
        working-directory: backend
        run: |
          python -c "import temporalio"
          python -m pytest -q -rs --junitxml=mission-results.xml tests/test_mission_orchestration.py
          python -c "from xml.etree import ElementTree as ET; report = ET.parse('mission-results.xml'); assert not report.findall('.//skipped'), 'A mission integration test was skipped'"
      - name: Show service logs on failure
        if: failure()
        run: |
          docker logs --tail 80 mongo-test || true
          docker logs --tail 80 temporal-test || true
